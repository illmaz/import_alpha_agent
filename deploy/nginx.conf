# Reverse proxy for ImportAlpha. One server, TLS terminated here, app on 8000.
#
# Replace every occurrence of REPLACE_WITH_DOMAIN before first use;
# deploy/setup.sh does this for you from the domain you pass it.

# Rate limits are per client IP. Two zones because the shapes differ: a browser
# loading the landing page bursts a handful of requests once, while an agent
# hitting /v1 is steady and automated. 10 MB holds roughly 160k addresses.
limit_req_zone $binary_remote_addr zone=site:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_status 429;

# Trust the real client IP when behind a load balancer. With a bare droplet
# there is no proxy in front, so this is a no-op; it matters the day one appears.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_WITH_DOMAIN;

    # Certbot renewals must reach this over plain HTTP, so it is matched
    # before the redirect below.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name REPLACE_WITH_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/REPLACE_WITH_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_WITH_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS is commented out on purpose. Once a browser has seen it, that
    # browser refuses plain HTTP for this domain for the whole max-age, which
    # is unpleasant if the certificate lapses early on. Turn it on once
    # renewal has worked at least once unattended.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Report payloads are JSON and small; nothing here accepts uploads.
    client_max_body_size 1m;

    gzip on;
    # text/html is always gzipped and listing it is a duplicate-MIME warning.
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;

    # Docker's embedded DNS. Without this nginx resolves "fastapi" once at
    # startup and caches the address forever, so the next deploy that
    # recreates the API container leaves nginx proxying to a dead IP until
    # someone reloads it by hand. The $upstream variable below is what forces
    # re-resolution; a literal proxy_pass host is resolved only at boot.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://fastapi:8000;

    access_log /var/log/nginx/importalpha.access.log;
    error_log  /var/log/nginx/importalpha.error.log warn;

    # --- static ------------------------------------------------------------
    # The landing page is one self-contained file, served straight from disk.
    # An exact-match location, so it cannot shadow any API route: everything
    # other than "/" falls through to the proxy below.
    location = / {
        limit_req zone=site burst=20 nodelay;
        root /srv/landing;
        try_files /index.html =404;
        # nginx does not merge add_header across levels: a location that sets
        # any add_header discards every one inherited from the server block.
        # Without these three repeated here, the most-visited page on the site
        # would be the only one served without its security headers.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=300";
    }

    # --- monitoring ---------------------------------------------------------
    # Unmetered so a probe can never be rate-limited into a false alarm.
    location = /health {
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- webhooks -----------------------------------------------------------
    # Stripe signs the raw body, so nothing here may alter it. Kept off the
    # API rate-limit zone: Stripe retries on 429 and a throttled webhook
    # delays crediting a payment that already succeeded.
    # Exact match, so it wins over the rate-limited /v1/ prefix below. The path
    # is /v1/webhooks/stripe — check app/api/v1/webhooks.py before changing it,
    # because a mismatch here fails silently: the webhook still works, it just
    # quietly falls into the API rate limit.
    location = /v1/webhooks/stripe {
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_request_buffering off;
    }

    # --- api ----------------------------------------------------------------
    location /v1/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # --- everything else ------------------------------------------------------
    location / {
        limit_req zone=site burst=20 nodelay;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }
}
