# Phase 3 — dockerized run lane.
#
# Rebuilt on main's sync bus (bus.produce / bus.consume). Every application
# service runs one of the repo's existing entrypoints unchanged; the only thing
# compose injects is BOOTSTRAP_SERVERS=kafka:9092.

x-app: &app
  build: .
  restart: unless-stopped
  depends_on:
    kafka:
      condition: service_healthy
  environment:
    BOOTSTRAP_SERVERS: kafka:9092
  # Optional: LLM_PROVIDER / LLM_API_KEY / ACTIVE_ROLES / TTLs. Absent .env is
  # not an error, so a fresh clone comes up on FakeLLM with no credentials.
  env_file:
    - path: .env
      required: false
  volumes:
    # Holds the curated fixtures and the SQLite file. Bind-mounted on every
    # app service (not just fastapi) so a worker that later needs to read or
    # write reports already has it, and so the database survives
    # `docker compose down`, which a named volume would also do but a
    # container-local file would not.
    - ./data:/app/data

services:
  kafka:
    # bitnami/kafka:3.9 was retired from Docker Hub (404); Bitnami moved
    # versioned tags to the bitnamilegacy namespace. See docs/DECISIONS.md.
    image: bitnamilegacy/kafka:3.9
    container_name: importalpha-kafka
    ports:
      # Host-visible on loopback only — never on the LAN.
      - "127.0.0.1:9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      # One broker listener on 9092 plus the KRaft controller on 9093. PR #1
      # bound two broker listeners to 9092, which the broker refuses to start.
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=1
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    # Deliberately no restart policy: the broker-resilience check kills kafka
    # and expects it to stay down until brought back by hand.

  orchestrator:
    <<: *app
    container_name: importalpha-orchestrator
    command: python orchestrator.py

  router:
    <<: *app
    container_name: importalpha-router
    command: python router_worker.py

  product_worker:
    <<: *app
    container_name: importalpha-product-worker
    command: python product_worker.py

  engineering_worker:
    <<: *app
    container_name: importalpha-engineering-worker
    command: python engineering_worker.py

  landing_worker:
    <<: *app
    container_name: importalpha-landing-worker
    command: python landing_worker.py

  artifact_logger:
    <<: *app
    container_name: importalpha-artifact-logger
    command: python artifact_logger.py

  # Settles report rows when the agent lane finishes a goal. Shares the
  # ./data mount with fastapi (via the shared anchor) so both processes open
  # the same SQLite file.
  report_listener:
    <<: *app
    container_name: importalpha-report-listener
    command: python scripts/report_listener.py

  fastapi:
    <<: *app
    container_name: importalpha-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot test runner: `docker compose run --rm pytest`.
  pytest:
    <<: *app
    restart: "no"
    profiles: ["test"]
    command: python -m pytest -q

  cli:
    <<: *app
    # One-shot: it must not be resurrected after submitting its goal, and it
    # must not start with a bare `docker compose up`.
    restart: "no"
    profiles: ["cli"]
    command: python scripts/submit_goal.py "hello"

volumes:
  kafka_data:
